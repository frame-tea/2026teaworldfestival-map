  return m[id[0]]||'emp';

function pl(col,row,id,cs,rs){

function buildTable(){
  var html='<table cellpadding="0"><tbody>';
  for(var row=0;row<NROWS;row++){
    html+='<tr>';
    for(var col=0;col<NCOLS;col++){
      var isGap=!!GAP[col];
      var cell=grid[row][col];
      if(isGap){
        if(row===0) html+='<td rowspan="'+NROWS+'" class="gap-td" style="width:'+GW+'px"><div class="gap-in">통로</div></td>';
        continue;
      }
      if(cell&&!cell.o)continue;
      if(!cell){
        html+='<td style="width:'+BW+'px;height:'+BH+'px;min-width:'+BW+'px"></td>';
        continue;
      }
      var id=cell.id,cs=cell.cs,rs=cell.rs;
      var w=0,h=BH*rs+G*(rs-1);
      // 특수 너비 계산
      if(id==='__stg__'||id==='A6'){
        // col0 + GAP1 + col2 + col3 = BW+G+GW+G+BW+G+BW
        w=BW+G+GW+G+BW+G+BW;
      } else {
        for(var dc=0;dc<cs;dc++){w+=cW(col+dc);if(dc<cs-1)w+=G;}
      }
      var inner='';
      if(id==='__stg__'){
        inner='<div class="b stg" style="width:'+w+'px;height:'+h+'px"><span class="bi">무 대</span></div>';
      } else if(id==='__pil__'||id==='__pil2__'){
        inner='<div class="b pil" style="width:'+BW+'px;height:'+BH+'px"><span class="bi">가동</span></div>';
        w=BW;
      } else {
        var nm=D[id]||'';
        inner='<div class="b '+(nm?zc(id):'emp')+'" data-id="'+id+'" data-nm="'+escH(nm)+'" onclick="tap(this)" style="width:'+w+'px;height:'+h+'px">'
          +'<span class="bi">'+id+'</span>'+(nm?'<span class="bn">'+escH(nm)+'</span>':'')+'</div>';
      }
      var csTd=cs;
      if(id==='__stg__'||id==='A6')csTd=4;
      html+='<td colspan="'+csTd+'" rowspan="'+rs+'" style="padding:0">'+inner+'</td>';
    }
    html+='</tr>';
  }
  html+='</tbody></table>';
  document.getElementById('map').innerHTML=html;
  var m=document.getElementById('map');
  var s=document.getElementById('sw');
  s.style.width=m.scrollWidth+'px';
  s.style.height=m.scrollHeight+'px';
}

document.addEventListener('DOMContentLoaded',function(){
  buildTable();
  document.getElementById('si').addEventListener('input',function(){ds(this.value);});
});

function ds(q){
  q=(q||'').trim().toLowerCase();
  var bs=document.querySelectorAll('.b[data-id]');
  var cnt=0;
  bs.forEach(function(b){
    var id=(b.getAttribute('data-id')||'').toLowerCase();
    var nm=(b.getAttribute('data-nm')||'').toLowerCase();
    var m=q&&(id.indexOf(q)>=0||nm.indexOf(q)>=0);
    b.className=b.className.replace(/ dim/g,'').replace(/ hl/g,'');
    if(!q){}else if(m){b.className+=' hl';cnt++;}else{b.className+=' dim';}
  });
  document.getElementById('sc').textContent=q?cnt+'개':'';
}
function rs(){document.getElementById('si').value='';ds('');}

var pt;
function tap(el){
  var id=el.getAttribute('data-id'),nm=el.getAttribute('data-nm');
  document.getElementById('si').value=id;
  ds(id);
  document.getElementById('pp').textContent=id+' 부스';
  document.getElementById('pq').textContent=nm||'';
  var p=document.getElementById('pop');
  p.className='pop on';
  clearTimeout(pt);
  pt=setTimeout(function(){p.className='pop';},3000);
}

function zoom(v){
  document.getElementById('zv').textContent=v+'%';
  var z=v/100;
  var s=document.getElementById('sw');
  var m=document.getElementById('map');
  s.style.webkitTransform='scale('+z+')';
  s.style.transform='scale('+z+')';
  s.style.width=Math.ceil(m.scrollWidth*z)+'px';
  s.style.height=Math.ceil(m.scrollHeight*z)+'px';
}
