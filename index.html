var COLS=23, ROWS=17;
var PAD=10; // canvas 여백

function cellX(col){
  // COL_MAP 기반 x 좌표 (SCALE 적용)
  return (COL_MAP[col]?COL_MAP[col][0]:PAD)*SCALE;
}
function cellY(row){return PAD*SCALE + row*(BH+G)*SCALE;}
function cellW(cs,col){
  // colspan 처리: 해당 col부터 cs개 열의 총 너비 + 사이 gap
  if(!col&&col!==0) return BW*SCALE;
  var w=0;
  for(var i=0;i<cs;i++){
    w+=(COL_MAP[col+i]?COL_MAP[col+i][1]:BW);
    if(i<cs-1) w+=G;
  }
  return w*SCALE;
}
function cellH(rs){return (BH*rs + G*(rs-1))*SCALE;}
function totalW(){return (2268)*SCALE;}
function totalH(){return PAD*2*SCALE + (ROWS*(BH+G)-G)*SCALE;}

function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawWrappedText(ctx,text,cx,y,maxW,lineH,maxH){
  // 글자 단위로 줄 나누기
  var words=text.split(/(?<=[,\s\/\(\)×])|(?=[,\s\/\(\)×])/);
  var lines=[],cur='';
  for(var i=0;i<words.length;i++){
    var w=words[i];
    if(ctx.measureText(cur+w).width<=maxW){cur+=w;}
    else{if(cur)lines.push(cur.trim());cur=w.trim();}
  }
  if(cur.trim())lines.push(cur.trim());
  // 최대 줄 수 제한
  var maxLines=Math.floor(maxH/lineH);
  if(lines.length>maxLines)lines=lines.slice(0,maxLines);
  var totalH2=lines.length*lineH;
  var startY=y+(maxH-totalH2)/2+lineH*0.85;
  for(var j=0;j<lines.length;j++){
    ctx.fillText(lines[j],cx,startY+j*lineH);
  }
}

function drawMap(ctx){
  var dpr=window.devicePixelRatio||1;
  ctx.save();
  ctx.scale(dpr,dpr);

  // 배경 (통로 색)
  ctx.fillStyle='#e8e4dc';
  ctx.fillRect(0,0,totalW(),totalH());

  // 외곽선
  ctx.strokeStyle='#7aab3a';
  ctx.lineWidth=2;
  roundRect(ctx,2,2,totalW()-4,totalH()-4,6);
  ctx.stroke();

  hitBoxes=[];

  // 통로 라벨 표시
  ctx.fillStyle='rgba(150,130,100,0.35)';
  ctx.font=(9*SCALE)+'px -apple-system,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  var corrCols=[4,7,10,13,16,19,22,26,30];
  for(var ci=0;ci<corrCols.length;ci++){
    var cc=corrCols[ci];
    var cx2=(COL_MAP[cc][0]+COL_MAP[cc][1]/2)*SCALE;
    var cy2=totalH()/2;
    ctx.save();ctx.translate(cx2,cy2);ctx.rotate(-Math.PI/2);
    ctx.fillStyle='rgba(120,100,70,0.5)';
    ctx.fillText('통 로',0,0);
    ctx.restore();
  }

  for(var i=0;i<CELLS.length;i++){
    var c=CELLS[i];
    var col=c[0],row=c[1],id=c[2],cs=c[3]||1,rs=c[4]||1;
    var x=cellX(col),y=cellY(row),w=cellW(cs,col),h=cellH(rs);
    var r=3*SCALE;

    var matched=false,dimmed=false;
    if(searchQ){
      var q=searchQ;
      var nm=DATA[id]||'';
      if((id&&id.toLowerCase().indexOf(q)>=0)||(nm&&nm.toLowerCase().indexOf(q)>=0)){matched=true;}
      else{dimmed=true;}
    }

    if(id==='__stg__'){
      ctx.globalAlpha=dimmed?0.18:1;
      ctx.fillStyle='#eeebe5';
      roundRect(ctx,x,y,w,h,r);ctx.fill();
      ctx.strokeStyle='#bbb';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='#aaa';ctx.font='bold '+(12*SCALE)+'px -apple-system,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('무 대',x+w/2,y+h/2);
      ctx.globalAlpha=1;continue;
    }
    if(id==='__pil__'){
      ctx.globalAlpha=dimmed?0.18:1;
      ctx.fillStyle='#ffe066';
      roundRect(ctx,x,y,w,h,r);ctx.fill();
      ctx.strokeStyle='#c8a800';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#6b3d00';ctx.font='bold '+(9*SCALE)+'px -apple-system,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('가동',x+w/2,y+h/2);
      ctx.globalAlpha=1;continue;
    }

    var nm=DATA[id]||'';
    var zone=id?id[0]:'';
    var zc2=ZC[zone]||{f:'#f0ece4',s:'#ccc',t:'#888'};

    ctx.globalAlpha=dimmed?0.15:1;

    // 부스 배경
    ctx.fillStyle=nm?zc2.f:'#f0ece4';
    roundRect(ctx,x,y,w,h,r);ctx.fill();
    // 하이라이트
    if(matched){
      ctx.strokeStyle='#e03000';ctx.lineWidth=2.5*SCALE;
    } else {
      ctx.strokeStyle=nm?zc2.s:'#ccc';ctx.lineWidth=1;
    }
    ctx.stroke();

    // 부스 번호
    var idFs=8.5*SCALE;
    ctx.fillStyle=nm?zc2.t:'#bbb';
    ctx.font='700 '+idFs+'px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(id,x+w/2,y+3*SCALE);

    // 부스명
    if(nm){
      var nmFs=7*SCALE;
      ctx.font=nmFs+'px -apple-system,sans-serif';
      ctx.fillStyle=zc2.t;
      var pad=4*SCALE;
      drawWrappedText(ctx,nm,x+w/2,y+idFs+4*SCALE,w-pad*2,nmFs*1.3,h-idFs-7*SCALE);
    }

    ctx.globalAlpha=1;

    // hitbox 등록 (실제 px 좌표 — DPR 미적용)
    hitBoxes.push({x:x,y:y,w:w,h:h,id:id,nm:nm});
  }

  // 하단 라벨
  ctx.globalAlpha=1;
  ctx.fillStyle='#666';
  ctx.font='bold '+(10*SCALE)+'px -apple-system,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='top';
  var botY=totalH()-PAD+2;
  ctx.fillText('입구·출구',cellX(1),botY-14);
  ctx.fillText('등  록  대',totalW()/2,botY-14);
  ctx.fillText('입구·출구',totalW()-cellX(1)-BW*SCALE,botY-14);

  ctx.restore();
}

var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');

function resize(){
  var dpr=window.devicePixelRatio||1;
  var W=totalW(),H=totalH();
  cv.width=Math.round(W*dpr);
  cv.height=Math.round(H*dpr);
  cv.style.width=W+'px';
  cv.style.height=H+'px';
  drawMap(ctx);
}

function getCanvasPos(e){
  var rect=cv.getBoundingClientRect();
  var cx,cy;
  if(e.touches){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  // canvas 내 실제 좌표 (CSS px 기준, DPR 무관)
  var scaleX=cv.offsetWidth/cv.offsetWidth; // always 1 since we set style=cssW
  return {x:cx-rect.left,y:cy-rect.top};
}

function hitTest(px,py){
  for(var i=hitBoxes.length-1;i>=0;i--){
    var b=hitBoxes[i];
    if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h)return b;
  }
  return null;
}

var popTimer;
function showPop(id,nm){
  document.getElementById('pp').textContent=id+' 부스';
  document.getElementById('pq').textContent=nm||'(배치 없음)';
  var p=document.getElementById('pop');
  p.className='pop on';
  clearTimeout(popTimer);
  popTimer=setTimeout(function(){p.className='pop';},3000);
}

cv.addEventListener('click',function(e){
  var pos=getCanvasPos(e);
  var b=hitTest(pos.x,pos.y);
  if(b){
    document.getElementById('si').value=b.id;
    searchQ=b.id.toLowerCase();
    document.getElementById('sc').textContent='';
    drawMap(ctx);
    showPop(b.id,b.nm);
  }
});
cv.addEventListener('touchend',function(e){
  if(e.changedTouches.length===1){
    var t=e.changedTouches[0];
    var rect=cv.getBoundingClientRect();
    var pos={x:t.clientX-rect.left,y:t.clientY-rect.top};
    var b=hitTest(pos.x,pos.y);
    if(b){
      e.preventDefault();
      document.getElementById('si').value=b.id;
      searchQ=b.id.toLowerCase();
      document.getElementById('sc').textContent='';
      drawMap(ctx);
      showPop(b.id,b.nm);
    }
  }
},{passive:false});

function doSearch(q){
  q=(q||'').trim().toLowerCase();
  searchQ=q;
  var cnt=0;
  if(q){
    for(var k in DATA){
      if(k.toLowerCase().indexOf(q)>=0||DATA[k].toLowerCase().indexOf(q)>=0)cnt++;
    }
  }
  document.getElementById('sc').textContent=q?cnt+'개 검색됨':'';
  drawMap(ctx);
}
function rs(){document.getElementById('si').value='';doSearch('');}

document.getElementById('si').addEventListener('input',function(){doSearch(this.value);});

document.getElementById('zs').addEventListener('input',function(){
  var z=parseInt(this.value)/100;
  document.getElementById('zv').textContent=this.value+'%';
  SCALE=z;
  resize();
});

// 초기 렌더
window.addEventListener('load',function(){resize();});
// DOMContentLoaded 백업 (인앱 브라우저)
if(document.readyState==='complete'||document.readyState==='interactive'){
  setTimeout(resize,0);
}
