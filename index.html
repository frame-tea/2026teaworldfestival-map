  if(!id)return 'emp';
  var z=id[0];
  return {A:'za',B:'zb',C:'zc',D:'zd',E:'ze',F:'zf',G:'zg',H:'zh'}[z]||'emp';
}

// 부스 HTML 생성
function mkBooth(id, w, h){
  var nm=D[id]||'';
  var cls='booth '+(nm?zc(id):'emp');
  var style='width:'+w+'px;height:'+h+'px;';
  return '<div class="'+cls+'" data-id="'+id+'" data-nm="'+escH(nm)+'" onclick="tap(this)" style="'+style+'">'
    +'<span class="bid">'+id+'</span>'
    +(nm?'<span class="bn">'+escH(nm)+'</span>':'')
    +'</div>';
}
function escH(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var BW=68,BH=54,G=5,CW=28;

// 각 셀: null | [id, cspan, rspan]

// 열 정의: 0-3=A좌, 4=GAP, 5-6=B, 7=GAP, 8-9=C, 10=GAP,
//          11-12=D, 13=GAP, 14-15=E, 16=GAP, 17-18=F, 19=GAP,

for(var r=0;r<TOTAL_ROWS;r++){grid[r]=[];for(var c=0;c<TOTAL_COLS;c++)grid[r][c]=null;}

function place(col,row,id,cs,rs){
  cs=cs||1;rs=rs||1;
  for(var dr=0;dr<rs;dr++)for(var dc=0;dc<cs;dc++)
    grid[row+dr][col+dc]={id:id,rs:rs,cs:cs,origin:(dr===0&&dc===0)};
}

// 원본: A좌(0-3), B(4-5), C(6-7), D(8-9), E(10-11), F(12-13), G(14-15), H(16-18), A우(22)
// 새:   A좌(0-3), B(5-6), C(8-9), D(11-12), E(14-15), F(17-18), G(20-21), H(23-25), A우(27)
function mc(c){ // map col
  if(c<=3)return c;
  if(c<=5)return c+1;   // B:4-5→5-6
  if(c<=7)return c+2;   // C:6-7→8-9
  if(c<=9)return c+3;   // D:8-9→11-12
  if(c<=11)return c+4;  // E:10-11→14-15
  if(c<=13)return c+5;  // F:12-13→17-18
  if(c<=15)return c+6;  // G:14-15→20-21
  if(c<=18)return c+7;  // H:16-18→23-25
  return c+9;           // A우:22→31→27(우측 단독)
}
// A우는 col27로
function mcA(c){if(c===22)return 27;return mc(c);}

function pp(c,r,id,cs,rs){p(mcA(c),r,id,cs,rs);}

// GAP 열 집합 (원본 col 기준 없음 → 새 col 기준)
var GAP_COLS=new Set([4,7,10,13,16,19,22,26]); // 새 col 기준 통로

ORIG.forEach(function(c){
  var oc=c[0],row=c[1],id=c[2],cs=c[3]||1,rs=c[4]||1;
  var nc=mcA(oc);
  // rowspan/colspan이 있을 때 GAP열 건너뛰기
  // (실제론 같은 구역 내 colspan이라 GAP 미포함)
  if(grid[row]&&grid[row][nc]!==undefined){
    for(var dr=0;dr<rs;dr++)for(var dc=0;dc<cs;dc++){
      if(grid[row+dr]&&grid[row+dr][nc+dc]!==undefined)
        grid[row+dr][nc+dc]={id:id,rs:rs,cs:cs,origin:(dr===0&&dc===0)};
    }
  }
});

// ── 테이블 렌더링 ────────────────────────────────────────────
function buildTable(){
  var html='<table cellspacing="'+G+'" cellpadding="0"><tbody>';
  for(var row=0;row<TOTAL_ROWS;row++){
    html+='<tr>';
    for(var col=0;col<TOTAL_COLS;col++){
      var isGap=GAP_COLS.has(col);
      var cell=grid[row][col];
      if(isGap){
        // 통로: 첫 행에만 rowspan=TOTAL_ROWS
        if(row===0) html+='<td rowspan="'+TOTAL_ROWS+'" style="width:'+CW+'px;background:#ddd8ce;border-radius:3px;vertical-align:middle;text-align:center"><span style="writing-mode:vertical-rl;font-size:9px;color:#aaa;letter-spacing:2px">통 로</span></td>';
        continue;
      }
      if(!cell){
        // 빈 셀
        html+='<td style="width:'+BW+'px;height:'+BH+'px"></td>';
      } else if(!cell.origin){
        // rowspan/colspan으로 이미 채워진 셀 → skip
        continue;
      } else {
        // 실제 부스
        var id=cell.id, cs=cell.cs, rs=cell.rs;
        var w=BW*cs+G*(cs-1), h=BH*rs+G*(rs-1);
        var td='<td colspan="'+cs+'" rowspan="'+rs+'" style="padding:0">';
        if(id==='__stg__'){
          td+='<div class="booth stg" style="width:'+w+'px;height:'+h+'px"><span class="bid">무 대</span></div>';
        } else if(id==='__pil__'){
          td+='<div class="booth pil" style="width:'+w+'px;height:'+h+'px"><span class="bid">가동</span></div>';
        } else {
          var nm=D[id]||'';
          var cls='booth '+(nm?zc(id):'emp');
          td+='<div class="'+cls+'" data-id="'+id+'" data-nm="'+escH(nm)+'" onclick="tap(this)" style="width:'+w+'px;height:'+h+'px">'
            +'<span class="bid">'+id+'</span>'
            +(nm?'<span class="bn">'+escH(nm)+'</span>':'')
            +'</div>';
        }
        html+=td+'</td>';
      }
    }
    html+='</tr>';
  }
  html+='</tbody></table>';
  document.getElementById('map').innerHTML=html;
}

buildTable();

// ── 검색 ─────────────────────────────────────────────────────
function doSearch(q){
  q=(q||'').trim().toLowerCase();
  var bs=document.querySelectorAll('.booth[data-id]');
  var cnt=0;
  for(var i=0;i<bs.length;i++){
    var b=bs[i];
    var id=(b.getAttribute('data-id')||'').toLowerCase();
    var nm=(b.getAttribute('data-nm')||'').toLowerCase();
    var m=q&&(id.indexOf(q)>=0||nm.indexOf(q)>=0);
    b.className=b.className.replace(/ dim/g,'').replace(/ hl/g,'');
    if(!q){}
    else if(m){b.className+=' hl';cnt++;}
    else{b.className+=' dim';}
  }
  document.getElementById('sc').textContent=q?cnt+'개':'';
}
function rs(){document.getElementById('si').value='';doSearch('');}
document.getElementById('si').addEventListener('input',function(){doSearch(this.value);});

// ── 팝업 ─────────────────────────────────────────────────────
var pt;
function tap(el){
  var id=el.getAttribute('data-id');
  var nm=el.getAttribute('data-nm');
  document.getElementById('si').value=id;
  doSearch(id);
  document.getElementById('pp').textContent=id+' 부스';
  document.getElementById('pq').textContent=nm||'';
  var p=document.getElementById('pop');
  p.className='pop on';
  clearTimeout(pt);
  pt=setTimeout(function(){p.className='pop';},3000);
}

// ── 줌 ───────────────────────────────────────────────────────
function zoom(v){
  document.getElementById('zv').textContent=v+'%';
  var z=v/100;
  var sw=document.getElementById('sw');
  var map=document.getElementById('map');
  sw.style.webkitTransform='scale('+z+')';
  sw.style.transform='scale('+z+')';
  sw.style.width=(map.offsetWidth*z)+'px';
  sw.style.height=(map.offsetHeight*z)+'px';
}
